name: schedulerse
services:
  schedulerse:
    image: ghcr.io/fixtse/schedulerse:latest
    pull_policy: always
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    env_file:
      - path: ./.env
        required: false
    environment:
      DATA_DIR: /data
      LISTEN_ADDR: ":8789"
    ports:
      - "127.0.0.1:8789:8789"
    volumes:
      - state:/data
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=16m
    healthcheck:
      test: ["CMD", "/app/schedulerse", "healthcheck"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 5s
volumes:
  state:
    name: schedulerse_state
